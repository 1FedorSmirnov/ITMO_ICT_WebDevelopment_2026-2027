{% extends 'base.html' %}

{% block content %}
<div class="card mx-auto" style="max-width: 480px">
    <div class="card-body">
        <h1 class="h4">Место на рейс {{ flight.number }}</h1>
        <p class="text-muted">{{ flight.from_city }} → {{ flight.to_city }}, {{ flight.takeoff|date:'d.m.Y H:i' }}</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary">Сохранить</button>
            <a class="btn btn-link" href="{% url 'flight' flight.pk %}">Назад к рейсу</a>
        </form>
    </div>
</div>
{% endblock %}
