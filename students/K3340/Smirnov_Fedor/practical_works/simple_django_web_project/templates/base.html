<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Автовладельцы</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 960px; margin: 0 auto; padding: 0 16px 32px; }
        nav { display: flex; gap: 20px; padding: 16px 0; margin-bottom: 8px; border-bottom: 1px solid #ccc; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        th { background: #f2f2f2; }
        form p label { display: block; margin-bottom: 4px; }
        form p input, form p select { width: 320px; padding: 4px; }
        .helptext { color: #666; font-size: 13px; }
        .errorlist { color: #c00; }
    </style>
</head>
<body>
<nav>
    <a href="{% url 'owner_list' %}">Владельцы</a>
    <a href="{% url 'owner_create' %}">Новый владелец</a>
    <a href="{% url 'car_list' %}">Автомобили</a>
    <a href="{% url 'car_create' %}">Новый автомобиль</a>
    <a href="{% url 'admin:index' %}">Django-admin</a>
</nav>
{% block content %}{% endblock %}
</body>
</html>
