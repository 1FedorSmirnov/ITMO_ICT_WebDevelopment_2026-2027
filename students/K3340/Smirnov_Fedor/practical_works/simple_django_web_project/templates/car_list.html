{% extends 'base.html' %}

{% block content %}
<h1>Автомобили</h1>
<p><a href="{% url 'car_create' %}">Добавить автомобиль</a></p>
<table>
    <tr><th>Госномер</th><th>Марка</th><th>Модель</th><th>Цвет</th><th></th></tr>
    {% for car in object_list %}
        <tr>
            <td><a href="{% url 'car_detail' car.pk %}">{{ car.plate }}</a></td>
            <td>{{ car.brand }}</td>
            <td>{{ car.model_name }}</td>
            <td>{{ car.color|default:'-' }}</td>
            <td><a href="{% url 'car_update' car.pk %}">изменить</a> | <a href="{% url 'car_delete' car.pk %}">удалить</a></td>
        </tr>
    {% empty %}
        <tr><td colspan="5">Автомобилей пока нет</td></tr>
    {% endfor %}
</table>
{% endblock %}
